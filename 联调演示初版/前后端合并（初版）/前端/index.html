<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸书智伴 · 冬日故事小屋</title><link rel="stylesheet" href="style.css?v=story-cabin-2"></head><body>
<div id="frontend-status" class="frontend-status" role="status" hidden></div>
<main id="home"><header class="home-entry"><div><small>纸书智伴</small><p>今天，和谁一起读故事？</p></div><button class="parent-entry" id="prepare-library">大人准备绘本</button></header><section class="room" aria-label="冬日故事小屋"><div class="room-title"><small>纸书智伴</small><h1>冬日故事小屋</h1></div>
<button class="animal rabbit" data-open="rabbit"><img src="assets/rabbit-seated.png" alt="坐在沙发上读书的兔子"><span>一起读故事</span></button>
<button class="animal fox" data-open="fox"><img src="assets/asset-2.webp" alt="书架旁的狐狸"><span>我的书架</span></button>
<button class="animal bear" data-open="bear"><img src="assets/asset-3.webp" alt="壁炉旁喝茶的熊熊"><span>选个声音</span></button>
<button class="animal owl" data-open="owl"><img src="assets/owl-perched.png" alt="停在书架梯子上的猫头鹰"><span>故事小挑战</span></button>
<div class="room-tools"><span class="demo-label" id="mode-label">正在连接后端</span><button id="motion" aria-pressed="false">减少动态</button></div></section><nav class="home-friends" aria-label="故事小伙伴"><button class="avatar-control avatar-rabbit" data-open="rabbit"><span class="animal-avatar" aria-hidden="true"></span><span>读故事</span></button><button class="avatar-control avatar-fox" data-open="fox"><span class="animal-avatar" aria-hidden="true"></span><span>我的书架</span></button><button class="avatar-control avatar-bear" data-open="bear"><span class="animal-avatar" aria-hidden="true"></span><span>选个声音</span></button><button class="avatar-control avatar-owl" data-open="owl"><span class="animal-avatar" aria-hidden="true"></span><span>小挑战</span></button></nav><p class="home-note">雪落在窗外，故事留在灯下。</p></main>
<main id="reader" hidden><header class="reading-head"><button id="back-home" class="avatar-control avatar-fox"><span class="animal-avatar" aria-hidden="true"></span><span>回小屋</span></button><span id="reading-title"></span><span class="reader-position" id="reader-position"></span><button id="reader-settings" class="reader-settings">阅读设置</button><span class="demo-label" id="reader-label" hidden></span></header><section class="reading-book"><div id="illustration" class="illustration"><img src="assets/asset-0.png" alt="冬夜的小屋与壁炉"><video id="page-video" controls playsinline preload="metadata" hidden></video><svg id="text-highlights" aria-hidden="true" hidden></svg><svg id="object-hints" aria-label="可以探索的物体" hidden></svg><span id="object-box" hidden></span><button class="touch-target" id="identify" aria-label="探索画面中的壁炉">壁炉</button><span id="object-result" hidden>壁炉 · 冬夜里的温暖火光</span></div><article class="reading-text"><details><summary>看看这页的文字</summary><small id="page-count"></small><h1 id="page-title"></h1><p id="page-text"></p><p id="explore-tip" class="explore-tip" role="status"></p><details id="narration-details" hidden><summary>听听故事里的另一种说法</summary><p id="narration-text"></p></details><details id="reading-details"><summary>阅读说明</summary><p class="muted" id="page-note"></p></details></details></article></section><nav class="reading-controls" aria-label="阅读控制"><button id="prev" class="avatar-control avatar-rabbit"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">上一页</span></button><button id="narrate" class="avatar-control avatar-bear"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">听一听</span></button><button id="toggle-video" hidden class="avatar-control avatar-owl"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">看故事</span></button><button id="hint-toggle" aria-pressed="true" class="avatar-control avatar-owl"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">找朋友</span></button><button id="next" class="avatar-control avatar-rabbit"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">下一页</span></button><button id="reader-voice" class="avatar-control avatar-bear"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">问一问</span></button><button id="reader-ask" hidden>文字问答</button><button id="reader-search" class="avatar-control avatar-fox"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">找一找</span></button><button id="reader-video" hidden>故事视频</button><button id="reader-history" class="avatar-control avatar-owl"><span class="animal-avatar" aria-hidden="true"></span><span class="control-caption">聊过什么</span></button><button id="save-book" hidden>放入书架</button></nav><p id="audio-status" role="status"></p><p id="page-loading" class="page-loading" role="status" hidden></p><aside id="reading-workbench" class="reading-workbench reader-drawer" aria-label="阅读小伙伴" hidden></aside></main>
<dialog id="dialog"><section class="paper" id="paper"><button id="close" class="close" aria-label="关闭">×</button><div id="content"></div></section></dialog><div id="toast" role="status" aria-live="polite"></div><script type="module" src="app.js?v=story-cabin-2"></script></body></html>
